[workspace]
members = [
    "bin/server",
    "bin/cli",
    "crates/core",
    "crates/database",
    "crates/api",
    "crates/mcp",
    "crates/auth",
    "crates/daemon",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/danielsan/agentregistry"

[workspace.dependencies]
# Internal crates
oxi-core = { path = "crates/core" }
oxi-database = { path = "crates/database" }
oxi-api = { path = "crates/api" }
oxi-mcp = { path = "crates/mcp" }
oxi-auth = { path = "crates/auth" }
oxi-daemon = { path = "crates/daemon" }
oxi-cli-lib = { path = "crates/cli" }

# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "uuid", "chrono", "json"] }
pgvector = { version = "0.4", features = ["sqlx"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# CLI
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"

# OpenAPI
utoipa = { version = "5.3", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8.0", features = ["axum"] }

# JWT & Auth
jsonwebtoken = "9.3"
argon2 = "0.5"
base64 = "0.22"

# Kubernetes client
kube = { version = "0.96", features = ["client", "runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["v1_31"] }

# Docker/OCI
bollard = "0.18"
oci-spec = "0.8"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = { version = "0.27", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.27", features = ["trace", "metrics", "http-proto", "reqwest-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace", "metrics"] }

# Prometheus metrics
prometheus = "0.13"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# UUID & Time
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Env & Config
dotenvy = "0.15"
config = "0.14"

# Utilities
futures = "0.3"
async-trait = "0.1"
bytes = "1.9"
regex = "1.11"
url = "2.5"
semver = "1.0"
once_cell = "1.20"
dashmap = "6.1"
hex = "0.4"
rand = "0.8"

# Terminal UI (for CLI progress bars, etc.)
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"

# Git operations
git2 = { version = "0.19", default-features = false }

# Compression
flate2 = "1.0"
tar = "0.4"

# Template engine (for code generation)
handlebars = "6.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 0
